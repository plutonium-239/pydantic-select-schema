[project]
name = "pydantic-select-schema"
version = "0.1.0"
description = "The select schema of a pydantic model: what model_dump emits, not what validation accepts."
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.10",
]

[project.scripts]
select-schema = "pydantic_select_schema:main"

[build-system]
requires = ["uv_build>=0.11.3,<0.12.0"]
build-backend = "uv_build"